<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102f24" />
    <meta name="description" content="RestOS+ · Restaurant operating system" />
    <title>RestOS+ · Restaurant System</title>
    <style>
      #boot-status{min-height:100vh;display:grid;place-items:center;background:#102f24;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding:24px;text-align:center}
      #boot-status .boot-card{max-width:680px}
      #boot-status strong{display:block;font-size:34px;margin-bottom:10px}
      #boot-status p{color:#bdd0c8;line-height:1.5}
      #boot-status pre{white-space:pre-wrap;word-break:break-word;text-align:left;background:#0b241b;padding:14px;border-radius:12px;color:#f5d8d8;font-size:12px}
    </style>
    <script>
      (function () {
        function showBootError(message) {
          var root = document.getElementById('root')
          var boot = document.getElementById('boot-status')
          if (!root || !boot) return
          root.innerHTML =
            '<div id="boot-status"><div class="boot-card">' +
            '<strong>RestOS+ no pudo iniciar</strong>' +
            '<p>La página llegó desde GitHub Pages, pero ocurrió un error al iniciar la aplicación.</p>' +
            '<pre>' + String(message || 'Error desconocido').replace(/[&<>]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c] }) + '</pre>' +
            '<p>Recarga la página. Si vuelve a aparecer, copia este mensaje.</p>' +
            '</div></div>'
        }
        window.addEventListener('error', function (event) {
          var target = event.target
          if (target && target !== window) {
            showBootError('No se pudo cargar: ' + (target.src || target.href || target.tagName))
            return
          }
          showBootError(event.message || 'Error de JavaScript')
        }, true)
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason
          showBootError(reason && (reason.stack || reason.message) ? (reason.stack || reason.message) : String(reason || 'Promesa rechazada sin detalle'))
        })
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-status">
        <div class="boot-card">
          <strong>RestOS+</strong>
          <p>Iniciando aplicación…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
